name: CI

on:
  pull_request:
    branches:
      - main
      - dev
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 20
    name: Build ${{ matrix.tag }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: 18-alpine
            base: node:18-alpine
          - tag: 18-slim
            base: node:18-slim
          - tag: 20-alpine
            base: node:20-alpine

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          build-args: BASE_IMAGE=${{ matrix.base }}
          tags: deepiri-suite:${{ matrix.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: |
          image="deepiri-suite:${{ matrix.tag }}"

          docker run --rm "$image" node --version
          docker run --rm "$image" bash --version
          docker run --rm "$image" dumb-init --version

          docker run --rm "$image" test -x /usr/local/bin/load-k8s-env.sh
          docker run --rm "$image" test -x /usr/local/bin/docker-entrypoint.sh
          docker run --rm "$image" test -x /usr/local/bin/prisma-baseline.sh
